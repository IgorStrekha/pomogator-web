<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex"/>
  <title>Обращение — ProBazis</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#12121F;--card:#1C1C30;--card-border:rgba(255,255,255,0.07);
      --accent:#348BFE;--accent-dim:rgba(52,139,254,0.1);
      --text-primary:#F0F0F5;--text-secondary:#9090A8;--footer:#404058;
      --ok:#3EB489;--warn:#F5A524;--muted-chip:rgba(255,255,255,0.08);
    }
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      background:var(--bg);color:var(--text-primary);line-height:1.6;min-height:100vh;}
    .hero{background:#000B1D;padding:44px 16px 36px;text-align:center;
      border-bottom:1px solid rgba(52,139,254,0.15);}
    .hero img{width:56px;height:56px;border-radius:14px;margin-bottom:14px;}
    .hero h1{font-size:1.6rem;font-weight:900;letter-spacing:-.4px;}
    .hero p{color:var(--text-secondary);font-size:.95rem;font-weight:500;margin-top:4px;}
    .container{max-width:560px;margin:0 auto;padding:28px 16px 64px;}
    .lang{display:flex;gap:6px;justify-content:flex-end;margin-bottom:18px;flex-wrap:wrap;}
    .lang a{font-size:.78rem;font-weight:700;padding:5px 12px;border-radius:20px;text-decoration:none;
      color:var(--text-secondary);border:1px solid var(--card-border);}
    .lang a.active{background:var(--accent);color:#fff;border-color:var(--accent);}
    .card{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:24px;}
    .ticket{font-family:ui-monospace,Consolas,monospace;font-size:1.5rem;font-weight:800;letter-spacing:.5px;}
    .chip{display:inline-block;font-size:.8rem;font-weight:700;padding:4px 12px;border-radius:20px;
      margin:12px 0 16px;background:var(--muted-chip);color:var(--text-secondary);}
    .chip.warn{background:rgba(245,165,36,.12);color:var(--warn);}
    .chip.ok{background:rgba(62,180,137,.12);color:var(--ok);}
    .chip.info{background:var(--accent-dim);color:var(--accent);}
    .text{color:var(--text-secondary);font-size:.95rem;}
    .text strong{color:var(--text-primary);}
    .meta{color:var(--footer);font-size:.82rem;margin-top:18px;}
    .footer{text-align:center;color:var(--footer);font-size:.82rem;margin-top:32px;}
    .footer a{color:var(--accent);font-weight:600;text-decoration:none;}
    .spinner{width:28px;height:28px;border:3px solid var(--card-border);border-top-color:var(--accent);
      border-radius:50%;animation:spin .7s linear infinite;margin:8px auto;}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="hero">
    <img src="assets/probazis.svg" alt="ProBazis"/>
    <h1>ProBazis</h1>
    <p id="heroSub">Обращение в модерацию</p>
  </div>

  <div class="container">
    <div class="lang" id="langBar"></div>
    <div class="card" id="card"><div class="spinner"></div></div>
    <div class="footer">
      <a href="terms.html#s6" id="termsLink">Правила отзывов</a> · © ProBazis
    </div>
  </div>

<script>
/* Публичная страница статуса обращения: probazis.com/ticket.html?id=PB-0042
   — модератор (вошёл в панель в этом браузере) сразу попадает в карточку дела;
   — клиент видит только номер, статус и срок — без личных данных (RPC get_ticket_status). */
var SB_URL='https://rwsaxowrrmrwzkisgkdv.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ3c2F4b3dycm1yd3praXNna2R2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3NDYxNDMsImV4cCI6MjA5ODMyMjE0M30.YVYLGxkfwUA2i8EFZ8r7m2CzCpzQVpqYHwtryf_otAM';
var sb=supabase.createClient(SB_URL,SB_KEY);

var LANGS=['ru','uk','be','pl','en','de'];
var T={
  ru:{sub:'Обращение в модерацию',terms:'Правила отзывов',ticket:'Обращение',
      pending:'На рассмотрении',awaiting:'Ждём подтверждения',resolved:'Проверка завершена',rejected:'Проверка завершена',
      pendingText:'Обращение получено. Модератор рассмотрит его в ближайшее время.',
      awaitingText:'Мы попросили автора отзыва подтвердить, что он пользовался услугой. Срок — до <strong>{0}</strong>.<br><br>Если вы автор отзыва — ответьте на письмо от ProBazis и приложите любое подтверждение: переписку или звонок со специалистом, чек, фото выполненной работы. Тему письма не меняйте.',
      resolvedReview:'Отзыв не прошёл проверку и скрыт.',rejectedReview:'Отзыв прошёл проверку и остаётся опубликованным.',
      resolvedOther:'По обращению принято решение.',rejectedOther:'Обращение рассмотрено, нарушений не найдено.',
      notFound:'Обращение не найдено. Проверьте номер в письме.',noId:'В ссылке нет номера обращения.',
      error:'Не удалось загрузить статус. Попробуйте позже.',created:'Создано',moderator:'Открываем дело в панели модерации…'},
  uk:{sub:'Звернення до модерації',terms:'Правила відгуків',ticket:'Звернення',
      pending:'На розгляді',awaiting:'Чекаємо підтвердження',resolved:'Перевірку завершено',rejected:'Перевірку завершено',
      pendingText:'Звернення отримано. Модератор розгляне його найближчим часом.',
      awaitingText:'Ми попросили автора відгуку підтвердити, що він користувався послугою. Термін — до <strong>{0}</strong>.<br><br>Якщо ви автор відгуку — дайте відповідь на лист від ProBazis і додайте будь-яке підтвердження: листування чи дзвінок зі спеціалістом, чек, фото виконаної роботи. Тему листа не змінюйте.',
      resolvedReview:'Відгук не пройшов перевірку і прихований.',rejectedReview:'Відгук пройшов перевірку і залишається опублікованим.',
      resolvedOther:'За зверненням ухвалено рішення.',rejectedOther:'Звернення розглянуто, порушень не знайдено.',
      notFound:'Звернення не знайдено. Перевірте номер у листі.',noId:'У посиланні немає номера звернення.',
      error:'Не вдалося завантажити статус. Спробуйте пізніше.',created:'Створено',moderator:'Відкриваємо справу в панелі модерації…'},
  be:{sub:'Зварот у мадэрацыю',terms:'Правілы водгукаў',ticket:'Зварот',
      pending:'На разглядзе',awaiting:'Чакаем пацвярджэння',resolved:'Праверка завершана',rejected:'Праверка завершана',
      pendingText:'Зварот атрыманы. Мадэратар разгледзіць яго ў бліжэйшы час.',
      awaitingText:'Мы папрасілі аўтара водгуку пацвердзіць, што ён карыстаўся паслугай. Тэрмін — да <strong>{0}</strong>.<br><br>Калі вы аўтар водгуку — адкажыце на ліст ад ProBazis і дадайце любое пацвярджэнне: перапіску ці званок са спецыялістам, чэк, фота выкананай працы. Тэму ліста не змяняйце.',
      resolvedReview:'Водгук не прайшоў праверку і схаваны.',rejectedReview:'Водгук прайшоў праверку і застаецца апублікаваным.',
      resolvedOther:'Па звароце прынята рашэнне.',rejectedOther:'Зварот разгледжаны, парушэнняў не знойдзена.',
      notFound:'Зварот не знойдзены. Праверце нумар у лісце.',noId:'У спасылцы няма нумара звароту.',
      error:'Не ўдалося загрузіць статус. Паспрабуйце пазней.',created:'Створаны',moderator:'Адкрываем справу ў панэлі мадэрацыі…'},
  pl:{sub:'Zgłoszenie do moderacji',terms:'Zasady opinii',ticket:'Zgłoszenie',
      pending:'W trakcie rozpatrywania',awaiting:'Czekamy na potwierdzenie',resolved:'Weryfikacja zakończona',rejected:'Weryfikacja zakończona',
      pendingText:'Zgłoszenie zostało przyjęte. Moderator rozpatrzy je wkrótce.',
      awaitingText:'Poprosiliśmy autora opinii o potwierdzenie, że korzystał z usługi. Termin — do <strong>{0}</strong>.<br><br>Jeśli jesteś autorem opinii, odpowiedz na wiadomość od ProBazis i dołącz dowolne potwierdzenie: korespondencję lub połączenie ze specjalistą, paragon, zdjęcie wykonanej pracy. Nie zmieniaj tematu wiadomości.',
      resolvedReview:'Opinia nie przeszła weryfikacji i została ukryta.',rejectedReview:'Opinia przeszła weryfikację i pozostaje opublikowana.',
      resolvedOther:'W sprawie zgłoszenia podjęto decyzję.',rejectedOther:'Zgłoszenie rozpatrzone, nie stwierdzono naruszeń.',
      notFound:'Nie znaleziono zgłoszenia. Sprawdź numer w wiadomości.',noId:'W linku brakuje numeru zgłoszenia.',
      error:'Nie udało się wczytać statusu. Spróbuj później.',created:'Utworzono',moderator:'Otwieramy sprawę w panelu moderacji…'},
  en:{sub:'Moderation request',terms:'Review policy',ticket:'Request',
      pending:'Under review',awaiting:'Waiting for confirmation',resolved:'Review completed',rejected:'Review completed',
      pendingText:'We have received the request. A moderator will look into it shortly.',
      awaitingText:'We have asked the author of the review to confirm they used the service. Deadline: <strong>{0}</strong>.<br><br>If you wrote the review, reply to the email from ProBazis and attach any confirmation: messages or a call with the specialist, a receipt, a photo of the work. Please keep the email subject unchanged.',
      resolvedReview:'The review did not pass verification and has been hidden.',rejectedReview:'The review passed verification and stays published.',
      resolvedOther:'A decision has been made on this request.',rejectedOther:'The request was reviewed, no violations were found.',
      notFound:'Request not found. Please check the number in the email.',noId:'The link has no request number.',
      error:'Could not load the status. Please try again later.',created:'Created',moderator:'Opening the case in the moderation panel…'},
  de:{sub:'Moderationsanfrage',terms:'Bewertungsrichtlinien',ticket:'Anfrage',
      pending:'In Prüfung',awaiting:'Warten auf Bestätigung',resolved:'Prüfung abgeschlossen',rejected:'Prüfung abgeschlossen',
      pendingText:'Die Anfrage ist eingegangen. Ein Moderator prüft sie in Kürze.',
      awaitingText:'Wir haben den Verfasser der Bewertung gebeten zu bestätigen, dass er die Leistung genutzt hat. Frist: <strong>{0}</strong>.<br><br>Wenn Sie die Bewertung verfasst haben, antworten Sie auf die E-Mail von ProBazis und fügen Sie einen Nachweis bei: Nachrichten oder ein Anruf mit dem Spezialisten, ein Beleg, ein Foto der Arbeit. Bitte ändern Sie den Betreff nicht.',
      resolvedReview:'Die Bewertung hat die Prüfung nicht bestanden und wurde ausgeblendet.',rejectedReview:'Die Bewertung hat die Prüfung bestanden und bleibt veröffentlicht.',
      resolvedOther:'Zu dieser Anfrage wurde entschieden.',rejectedOther:'Die Anfrage wurde geprüft, es wurden keine Verstöße festgestellt.',
      notFound:'Anfrage nicht gefunden. Bitte prüfen Sie die Nummer in der E-Mail.',noId:'Der Link enthält keine Anfragenummer.',
      error:'Status konnte nicht geladen werden. Bitte später erneut versuchen.',created:'Erstellt',moderator:'Fall wird im Moderationsbereich geöffnet…'}
};

var params=new URLSearchParams(location.search);
var ticketId=(params.get('id')||'').trim();
var lang=pickLang();
var lastData=null, lastState='loading';

function pickLang(){
  var q=params.get('lang');
  if(LANGS.indexOf(q)!==-1) return q;
  try{ var s=localStorage.getItem('probazis-language'); if(LANGS.indexOf(s)!==-1) return s; }catch(e){}
  var b=(navigator.language||'ru').slice(0,2).toLowerCase();
  return LANGS.indexOf(b)!==-1?b:'ru';
}
function setLang(l){
  lang=l;
  try{ localStorage.setItem('probazis-language',l); }catch(e){}
  render();
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(d){
  var loc={ru:'ru-RU',uk:'uk-UA',be:'be-BY',pl:'pl-PL',en:'en-GB',de:'de-DE'}[lang];
  return new Date(d).toLocaleDateString(loc,{day:'numeric',month:'long',year:'numeric'});
}

function render(){
  var t=T[lang];
  document.documentElement.lang=lang;
  document.getElementById('heroSub').textContent=t.sub;
  document.getElementById('termsLink').textContent=t.terms;
  document.title=t.ticket+(ticketId?' '+ticketId:'')+' — ProBazis';
  document.getElementById('langBar').innerHTML=LANGS.map(function(l){
    return '<a href="#" class="'+(l===lang?'active':'')+'" onclick="setLang(\''+l+'\');return false">'+l.toUpperCase()+'</a>';
  }).join('');

  var card=document.getElementById('card');
  if(lastState==='loading'){ card.innerHTML='<div class="spinner"></div>'; return; }
  if(lastState==='moderator'){ card.innerHTML='<div class="spinner"></div><p class="text" style="text-align:center">'+t.moderator+'</p>'; return; }
  if(lastState!=='ok'){
    card.innerHTML='<p class="text">'+t[lastState]+'</p>';
    return;
  }

  var d=lastData, isReview=d.target_type==='review';
  var chip, text;
  if(d.status==='awaiting_author'){
    chip='<span class="chip warn">'+t.awaiting+'</span>';
    text=t.awaitingText.replace('{0}',esc(fmt(d.evidence_deadline)));
  } else if(d.status==='resolved'){
    chip='<span class="chip ok">'+t.resolved+'</span>';
    text=isReview?t.resolvedReview:t.resolvedOther;
  } else if(d.status==='rejected'){
    chip='<span class="chip ok">'+t.rejected+'</span>';
    text=isReview?t.rejectedReview:t.rejectedOther;
  } else {
    chip='<span class="chip info">'+t.pending+'</span>';
    text=t.pendingText;
  }
  card.innerHTML=
    '<div class="text">'+t.ticket+'</div>'+
    '<div class="ticket">'+esc(d.ticket)+'</div>'+
    chip+
    '<p class="text">'+text+'</p>'+
    '<div class="meta">'+t.created+': '+esc(fmt(d.created_at))+'</div>';
}

async function init(){
  render();
  if(!/\d/.test(ticketId)){ lastState='noId'; render(); return; }

  /* Модератор, вошедший в панель в этом браузере, — сразу в карточку дела */
  try{
    var s=await sb.auth.getSession();
    var user=s.data&&s.data.session&&s.data.session.user;
    if(user){
      var pr=await sb.from('profiles').select('role').eq('id',user.id).single();
      if(pr.data&&pr.data.role===3){
        lastState='moderator'; render();
        location.replace('moderation.html#'+encodeURIComponent(ticketId.toUpperCase()));
        return;
      }
    }
  }catch(e){ /* не модератор — показываем публичный статус */ }

  try{
    var r=await sb.rpc('get_ticket_status',{p_ticket:ticketId});
    if(r.error) throw r.error;
    var row=(r.data||[])[0];
    if(!row){ lastState='notFound'; render(); return; }
    lastData=row; lastState='ok'; render();
  }catch(e){
    lastState='error'; render();
  }
}

init();
</script>
</body>
</html>
